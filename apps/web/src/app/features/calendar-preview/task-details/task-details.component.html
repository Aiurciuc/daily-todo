<terra-task-inspector-card
  [task]="details()"
  [canEdit]="task().canEdit !== false"
  (completionToggled)="task().canEdit !== false && completionToggled.emit()"
  (linkRequested)="linkRequested.emit()"
  (editRequested)="task().canEdit !== false && editRequested.emit()"
>
  <div inspectorSharing>
    @if (task().canEdit === false) {
      <p class="sharing-info">Shared with you · Read-only. Only the owner can change this task.</p>
    } @else if (task().shared && task().sharedWith) {
      <p class="sharing-info">Shared with {{ task().sharedWith }} · Recipient has read-only access.</p>
    }
  </div>
  @if (task().canEdit !== false) {
    <button
      inspectorAction
      terraButton
      variant="outlined"
      aria-label="Delete task"
      [disabled]="saving()"
      (click)="deleteRequested.emit()"
    >
      <terra-icon name="delete" /> Delete task
    </button>
  }
</terra-task-inspector-card>
