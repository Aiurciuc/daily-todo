<div class="toolbar card">
  <div class="range-controls">
    <div class="navigation">
      <button
        terraButton
        variant="ghost"
        size="icon"
        [attr.aria-label]="'Previous ' + view().toLowerCase()"
        (click)="periodMoved.emit(-1)"
      >
        <terra-icon name="chevron_left" />
      </button>
      <button terraButton variant="outlined" size="compact" (click)="todayRequested.emit()">
        Today
      </button>
      <button
        terraButton
        variant="ghost"
        size="icon"
        [attr.aria-label]="'Next ' + view().toLowerCase()"
        (click)="periodMoved.emit(1)"
      >
        <terra-icon name="chevron_right" />
      </button>
    </div>
    @if (view() === 'Month') {
      <h1>{{ month() | date: 'MMMM yyyy' }}</h1>
    } @else if (view() === 'Day') {
      <h1>{{ activeDate() | date: 'EEE, MMM d, yyyy' }}</h1>
    } @else {
      <h1>{{ rangeStart() | date: 'MMM d' }} – {{ rangeEnd() | date: 'MMM d, yyyy' }}</h1>
      <span class="week-number">W{{ rangeStart() | date: 'w' }}</span>
    }
  </div>
  <div class="tools">
    <terra-segmented-filter
      class="view-switcher"
      label="View options"
      [options]="viewOptions"
      [value]="view()"
      (valueChanged)="viewChanged.emit($event)"
    />
    <terra-segmented-filter
      class="filters"
      label="Task visibility"
      variant="pills"
      [options]="filterOptions()"
      [value]="filter()"
      (valueChanged)="filterChanged.emit($event)"
    />
    <button
      terraButton
      variant="secondary"
      size="compact"
      class="block-time"
      (click)="createRequested.emit()"
    >
      <terra-icon name="add_circle" /> Block Time
    </button>
  </div>
</div>
