<section class="task-area" aria-label="Tasks for the selected day" [attr.aria-busy]="loading()">
  @if (loading()) {
    <p role="status">Loading tasks…</p>
  } @else if (tasks().length === 0 && !error()) {
    <p class="empty">No tasks for this day.</p>
  } @else {
    <ul
      cdkDropList
      [cdkDropListData]="tasks()"
      [cdkDropListDisabled]="!canInteract()"
      (cdkDropListDropped)="
        reorderRequested.emit({
          previousIndex: $event.previousIndex,
          currentIndex: $event.currentIndex,
          taskId: $event.item.data,
        })
      "
    >
      @for (task of tasks(); track task.id; let index = $index) {
        <li cdkDrag [cdkDragData]="task.id" [cdkDragDisabled]="!canInteract()">
          <button
            type="button"
            class="drag-handle"
            cdkDragHandle
            [disabled]="!canInteract()"
            [attr.aria-label]="'Reorder ' + task.title"
            title="Drag to reorder, or use Up/Down arrow keys"
            (keydown.arrowup)="
              $event.preventDefault();
              reorderRequested.emit({
                previousIndex: index,
                currentIndex: index - 1,
                taskId: task.id,
              })
            "
            (keydown.arrowdown)="
              $event.preventDefault();
              reorderRequested.emit({
                previousIndex: index,
                currentIndex: index + 1,
                taskId: task.id,
              })
            "
          >
            ↕
          </button>
          <label [class.done]="task.completed">
            <input
              type="checkbox"
              [checked]="task.completed"
              [disabled]="!canInteract()"
              (change)="toggleCompletion(task, $event)"
            />
            <span>{{ task.title }}</span>
          </label>
        </li>
      }
    </ul>
  }
</section>
